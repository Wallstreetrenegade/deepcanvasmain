name: deepcanvas

services:
  db:
    image: postgres:17-alpine
    container_name: deepcanvas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepcanvas}
      POSTGRES_USER: ${POSTGRES_USER:-deepcanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.render
    image: deepcanvas-office:latest
    container_name: deepcanvas-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deepcanvas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deepcanvas}
      PORT: "10000"
      HOME: /var/data
      WEB_HOST: 127.0.0.1
      WEB_PORT: "19000"
      WEB_PATH: /ws
      LOG_LEVEL: INFO
      DEEPCANVAS_REQUIRE_WEB_AUTH: "true"
      VITE_AUTH_BYPASS: "false"
      ALLOWED_WS_ORIGIN_HOSTS: ${DOMAIN:?Set DOMAIN in deploy/.env.production},www.${DOMAIN:?Set DOMAIN in deploy/.env.production}
    volumes:
      - /var/lib/deepcanvas:/var/data
    expose:
      - "10000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    container_name: deepcanvas-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
